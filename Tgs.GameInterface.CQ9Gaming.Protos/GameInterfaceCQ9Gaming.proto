syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.CQ9Gaming.Protos";

package GameInterfaceCQ9Gaming;

// The greeting service definition.
service GameInterfaceCQ9Gaming {
  // Sends a greeting
  rpc PlayerCreate (PlayerCreateRequest) returns (BaseReply);
  rpc PlayerBalance (PlayerBalanceRequest) returns (PlayerBalanceReply);
  rpc PlayerOnline (PlayerOnlineRequest) returns (PlayerOnlineReply);
  rpc PlayerLogout (PlayerLogoutRequest) returns (BaseReply);
  rpc FundOut(FundRequest) returns (FundReply);
  rpc FundIn (FundRequest) returns (FundReply);
  rpc FundStatus(FundStatusRequest) returns (BaseReply);
  rpc GameLogin (GameLoginRequest) returns (GameLoginReply);
  rpc GameUrl (GameUrlRequest) returns (GameUrlReply);
  rpc GameRecord (GameRecordRequest) returns (GameRecordReply);
  rpc CheckingService(CheckingServiceRequest) returns (CheckingServiceReply);
}

// The request message containing the user's name.
message PlayerCreateRequest {
	string api_url = 1;
	string api_token = 2;
	string player_code= 3;
}

message PlayerBalanceRequest {
	string api_url = 1;
	string api_token = 2;
	string player_code= 3;
}

message PlayerOnlineRequest {
	string api_url = 1;
	string api_token = 2;
	string player_code= 3;
}

message PlayerLogoutRequest {
	string api_url = 1;
	string api_token = 2;
	string player_code= 3;
}

message FundRequest {
	string api_url = 1;
	string api_token = 2;
	string player_code= 3;
	string order_id = 4;
	phoenix.protobuf.DecimalValue amount = 5;
}

message FundStatusRequest {
	string api_url = 1;
	string api_token = 2;
	string order_id = 3;
}

message GameLoginRequest {
	string api_url = 1;
	string api_token = 2;
	string player_code= 3;
}

message GameUrlRequest {
	string api_url = 1;
	string api_token = 2;
	string user_token= 3;
	string game_code= 4;
	bool is_mobile = 5;
	string language= 6;
}

message GameRecordRequest {
	string api_url = 1;
	string api_token = 2;
	google.protobuf.Timestamp start_time = 3; 
	google.protobuf.Timestamp end_time = 4;
	int32 page = 5;
	int32 page_size = 6;
}

message CheckingServiceRequest{
	string machine_name = 1;
}

// The response message containing the greetings.
message BaseReply{
	bool status = 1;
}

message PlayerBalanceReply {
	bool is_player_exist = 1;
	phoenix.protobuf.DecimalValue balance = 2;
}

message PlayerOnlineReply {
	bool online  = 1;
}

message FundReply {
	phoenix.protobuf.DecimalValue balance = 1;
	string resp = 2;
}

message GameLoginReply {
	string user_token = 1;
}

message GameUrlReply {
	string game_url = 1;
}

message GameRecordReply {
	repeated GameRecordInfo items = 1;
}

message GameRecordInfo {
	string player_code = 1;
	string external_round_id = 2;
	string external_bet_id = 3;
	string external_game_id = 4;
	google.protobuf.Timestamp external_created_on = 5;
	google.protobuf.Timestamp external_closed_on = 6;
	bool is_freegame = 7;
	phoenix.protobuf.DecimalValue bet = 8;
	phoenix.protobuf.DecimalValue valid_bet = 9;
	phoenix.protobuf.DecimalValue settle = 10;
	phoenix.protobuf.DecimalValue win_loss = 11;
	phoenix.protobuf.DecimalValue jackpot = 12;
	string additional_data = 13;
}

message CheckingServiceReply{
	string machine_name = 1;
}